name: OldySend

on:
  push:
    branches: ["**"]
    tags: ["oldysend-v*"]
    paths:
      - "oldysend/**"
      - ".github/workflows/oldysend.yml"
  pull_request:
    paths:
      - "oldysend/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: the image ships the Android SDK; ubuntu-latest moves to a new Ubuntu on 2026-10-19.
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.OLDYSEND_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: oldysend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already contains the Android SDK and sdkmanager (no third-party setup action needed).
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OLDYSEND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint (API guard down to Android 1.0)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintDebug

      - name: Build
        env:
          OLDYSEND_KEYSTORE_PASSWORD: ${{ secrets.OLDYSEND_KEYSTORE_PASSWORD }}
          OLDYSEND_KEY_ALIAS: ${{ secrets.OLDYSEND_KEY_ALIAS }}
          OLDYSEND_KEY_PASSWORD: ${{ secrets.OLDYSEND_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify v1 (JAR) signature for Android 1.x
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --min-sdk-version 1 --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          VERSION=$(grep versionName app/build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          cp app/build/outputs/apk/release/app-release.apk "dist/OldySend-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/OldySend-$VERSION-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OldySend-apk
          path: oldysend/dist/*.apk

      - name: Refuse to release with the debug key
        if: startsWith(github.ref, 'refs/tags/oldysend-v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::The OLDYSEND_KEYSTORE_* secrets are missing; a release signed with the debug key could not be updated later."
          exit 1

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/oldysend-v')
        run: cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/oldysend-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oldysend/dist/*.apk
            oldysend/dist/SHA256SUMS.txt
          body_path: oldysend/RELEASE_NOTES.md
